<div class="section-gradient rounded-2xl p-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-users text-white text-xl"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">User Management</h2>
                <p class="text-sm text-gray-600 dark:text-gray-300">Manage user roles and permissions</p>
            </div>
        </div>
        <button class="mt-4 md:mt-0 px-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-lg hover:shadow-xl" 
                id="create-user-btn"
                data-loading="Creating...">
            <i class="fas fa-plus mr-2"></i>Add New User
        </button>
    </div>
    
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
        <div id="users-table-container">
            <div id="loading-users" class="hidden p-8 text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-300 font-medium">Loading users...</p>
            </div>
            <div class="hidden p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 rounded-lg m-4" id="users-error">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle text-red-500 mr-3 text-lg"></i>
                    <span class="text-red-800 dark:text-red-200 font-medium"></span>
                </div>
            </div>
            
            <!-- Primary Table View for Users -->
            <div class="overflow-x-auto" id="users-table-view">
                <!-- Initial loading state -->
                <div class="p-8 text-center" id="users-initial-loading">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
                    <p class="mt-4 text-gray-600 dark:text-gray-300 font-medium">Loading users...</p>
                </div>
            </div>
            
            <!-- Fallback Card View (hidden by default) -->
            <div id="users-cards-container" class="hidden p-6 space-y-4 bg-transparent">
                <!-- User cards will be populated here -->
            </div>
            
            <!-- Legacy table structure (for compatibility) -->
            <div class="overflow-x-auto hidden" id="users-table-fallback">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">User</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                        <!-- Table rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
