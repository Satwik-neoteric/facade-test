<div class="section-gradient rounded-2xl p-6" id="batch-management-section">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-layer-group text-white text-xl"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Batch Management</h2>
                <p class="text-sm text-gray-600 dark:text-gray-300">Organize and process image batches</p>
            </div>
        </div>
        <div class="mt-4 md:mt-0 flex flex-wrap gap-3">
            <button class="px-5 py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-lg hover:shadow-xl" 
                    id="register-batch-btn"
                    data-loading="Registering...">
                <i class="fas fa-plus mr-2"></i>New Batch
            </button>
            <button class="px-5 py-3 bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-700 hover:to-gray-800 text-white rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-lg hover:shadow-xl" 
                    id="upload-images-btn"
                    data-loading="Uploading...">
                <i class="fas fa-upload mr-2"></i>Upload
            </button>
            <button class="px-5 py-3 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-lg hover:shadow-xl" 
                    id="run-inference-btn"
                    data-loading="Running...">
                <i class="fas fa-play mr-2"></i>Run Inference
            </button>
        </div>
    </div>
    
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
        <div id="loading-batches" class="hidden p-8 text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="mt-4 text-gray-600 dark:text-gray-300 font-medium">Loading batches...</p>
        </div>
        <div class="hidden p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 rounded-lg m-4" id="batches-error">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle text-red-500 mr-3 text-lg"></i>
                <span class="text-red-800 dark:text-red-200 font-medium"></span>
            </div>
        </div>
        
        <!-- Primary Table View for Batches -->
        <div class="overflow-x-auto" id="batches-table-view">
            <!-- Table will be populated here by admin-cards.js -->
        </div>
        
        <!-- Fallback Card View (hidden by default) -->
        <div id="batches-cards-container" class="hidden p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-transparent">
            <!-- Batch cards will be populated here -->
        </div>
        
        <!-- Legacy table structure (for compatibility) -->
        <div class="overflow-x-auto hidden" id="batches-table-fallback">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700" id="batches-table">
                <thead class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Batch ID</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Images</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Modified</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="batches-table-body" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                    <!-- Table rows will be populated here -->
                </tbody>
            </table>
        </div>
    </div>
</div>
