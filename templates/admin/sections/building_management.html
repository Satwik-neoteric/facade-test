<div class="section-gradient rounded-2xl p-6" id="buildings-management-section">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-gradient-to-r from-yellow-500 to-yellow-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-building text-white text-xl"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Buildings Management</h2>
                <p class="text-sm text-gray-600 dark:text-gray-300">Register and manage building information</p>
            </div>
        </div>
        <div class="mt-4 md:mt-0 flex flex-wrap gap-3">
            <button id="openBuildingModalBtn" 
                    class="px-6 py-3 bg-gradient-to-r from-yellow-600 to-yellow-700 hover:from-yellow-700 hover:to-yellow-800 text-white rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-lg hover:shadow-xl"
                    data-loading="Opening...">
                <i class="fas fa-plus mr-2"></i>Add Building
            </button>
            <button class="px-6 py-3 bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-700 hover:to-gray-800 text-white rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 shadow-lg hover:shadow-xl" 
                    id="refresh-buildings"
                    data-loading="Refreshing...">
                <i class="fas fa-sync mr-2"></i>Refresh
            </button>
        </div>
    </div>
    
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
        <div id="buildings-table-container">
            <div id="loading-buildings" class="hidden p-8 text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-yellow-600 border-t-transparent"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-300 font-medium">Loading buildings...</p>
            </div>
            <div class="hidden p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 rounded-lg m-4" id="buildings-error">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle text-red-500 mr-3 text-lg"></i>
                    <span class="text-red-800 dark:text-red-200 font-medium"></span>
                </div>
            </div>
            
            <!-- Buildings Table Container -->
            <div class="overflow-x-auto" id="buildings-table-view">
                <!-- Buildings table will be populated here -->
            </div>
            
            <!-- Buildings Cards Container (fallback) -->
            <div id="buildings-cards-container" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-transparent hidden">
                <!-- Building cards will be populated here -->
            </div>
        </div>
    </div>
</div>
