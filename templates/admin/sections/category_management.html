<div class="management-section">
    <div class="section-header">
        <h2><i class="fas fa-tags"></i> Category Management</h2>
        <div class="header-actions">
            <button class="btn btn-outline-primary btn-sm" id="refresh-categories">
                <i class="fas fa-sync-alt"></i> Refresh Categories
            </button>
            <button class="btn btn-primary btn-sm" id="create-category-btn">
                <i class="fas fa-plus"></i> Add Category
            </button>
        </div>
    </div>
    <div class="table-container">
        <div id="loading-categories" class="alert alert-info" style="display: none;">Loading categories...</div>
        <div class="alert alert-danger" id="categories-error" style="display: none;"></div>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="categories-table-body"></tbody>
        </table>
    </div>
</div>
