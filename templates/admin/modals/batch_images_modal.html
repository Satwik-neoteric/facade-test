<!-- Batch Images Modal -->
<div id="batch-images-modal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-2xl">
            <div class="modal-header bg-gradient-to-r from-violet-600 to-violet-700 text-white border-0 rounded-t-xl">
                <h4 class="modal-title font-bold text-lg">Batch Images Gallery</h4>
                <button type="button" class="btn-close btn-close-white modal-close opacity-75 hover:opacity-100" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-6">
                <div id="loading-batch-images" class="alert alert-info bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700 text-blue-800 dark:text-blue-200 p-4 rounded-xl flex items-center">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600 mr-3"></div>
                    <i class="fas fa-info-circle mr-2"></i>Loading images...
                </div>
                <div id="batch-images-error" class="alert alert-danger bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 text-red-800 dark:text-red-200 p-4 rounded-xl" style="display: none;">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span class="font-medium"></span>
                </div>
                <div id="batch-images-container" class="grid grid-cols-2 md:grid-cols-3 gap-4 max-h-96 overflow-y-auto p-2 bg-gray-50 dark:bg-gray-800 rounded-xl">
                    <!-- Images grid will be loaded here dynamically -->
                </div>
            </div>
            <div class="modal-footer bg-gray-50 dark:bg-gray-800 border-0 rounded-b-xl p-6 flex space-x-3">
                <button type="button" class="btn btn-secondary px-6 py-2 bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 border-0 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-500 transition-all duration-200" data-bs-dismiss="modal">
                    <i class="fas fa-times mr-2"></i>Close
                </button>
                <a id="download-all-batch-images" href="#" class="btn btn-primary px-6 py-2 bg-gradient-to-r from-violet-600 to-violet-700 hover:from-violet-700 hover:to-violet-800 text-white border-0 rounded-lg font-medium transition-all duration-200 shadow-lg hover:shadow-xl transform hover:scale-105">
                    <i class="fas fa-download mr-2"></i>Download All
                </a>
            </div>
        </div>
    </div>
</div>
