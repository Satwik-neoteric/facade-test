<!-- Building Modal -->
<div class="modal fade" id="buildingModal" tabindex="-1" aria-labelledby="buildingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-2xl">
            <div class="modal-header bg-gradient-to-r from-yellow-600 to-yellow-700 text-white border-0 rounded-t-xl">
                <h4 class="modal-title font-bold text-lg" id="buildingModalTitle">Register Building</h4>
                <button type="button" class="btn-close btn-close-white opacity-75 hover:opacity-100" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-6">
                <form id="buildingForm" class="space-y-4">
                    <div class="form-group">
                        <label for="buildingName" class="form-label text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 block">
                            <i class="fas fa-building mr-2 text-yellow-500"></i>Building Name
                        </label>
                        <input type="text" 
                               class="form-control w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all duration-200 bg-white dark:bg-gray-800 text-gray-900 dark:text-white" 
                               id="buildingName" 
                               placeholder="Enter building name"
                               required>
                    </div>
                    <div class="form-group">
                        <label for="buildingAddress" class="form-label text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 block">
                            <i class="fas fa-map-marker-alt mr-2 text-red-500"></i>Address
                        </label>
                        <input type="text" 
                               class="form-control w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all duration-200 bg-white dark:bg-gray-800 text-gray-900 dark:text-white" 
                               id="buildingAddress" 
                               placeholder="Enter complete address"
                               required>
                    </div>
                    <div id="buildingModalError" class="alert alert-danger bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 text-red-800 dark:text-red-200 p-4 rounded-xl" style="display: none;">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        <span class="font-medium"></span>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-gray-50 dark:bg-gray-800 border-0 rounded-b-xl p-6 flex space-x-3">
                <button type="button" class="btn btn-secondary px-6 py-2 bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 border-0 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-500 transition-all duration-200" data-bs-dismiss="modal">
                    <i class="fas fa-times mr-2"></i>Cancel
                </button>
                <button id="buildingFormSaveBtn" type="submit" form="buildingForm"
                        class="btn btn-primary px-6 py-2 bg-gradient-to-r from-yellow-600 to-yellow-700 hover:from-yellow-700 hover:to-yellow-800 text-white border-0 rounded-lg font-medium transition-all duration-200 shadow-lg hover:shadow-xl transform hover:scale-105">
                    <i class="fas fa-save mr-2"></i>Save Building
                </button>

            </div>
        </div>
    </div>
</div>
