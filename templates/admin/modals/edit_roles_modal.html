<div id="editRolesModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-2xl">
            <div class="modal-header bg-gradient-to-r from-indigo-600 to-indigo-700 text-white border-0 rounded-t-xl">
                <h4 class="modal-title font-bold text-lg" id="editRolesModalLabel">Edit User Roles</h4>
                <button type="button" class="btn-close btn-close-white modal-close opacity-75 hover:opacity-100" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-6">
                <form id="edit-roles-form" class="space-y-4">
                    <div class="form-group">
                        <label for="edit-username-display" class="form-label text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 block">
                            <i class="fas fa-user mr-2 text-indigo-500"></i>Username
                        </label>
                        <div class="px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white font-medium">
                            <span id="edit-username-display"></span>
                        </div>
                        <input type="hidden" id="edit-username">
                    </div>
                    <div class="form-group">
                        <label class="form-label text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3 block">
                            <i class="fas fa-user-tag mr-2 text-purple-500"></i>User Roles
                        </label>
                        <div class="checkbox-group space-y-3">
                            <div class="form-check flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors duration-200">
                                <input class="form-check-input w-5 h-5 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 dark:focus:ring-indigo-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" 
                                       type="checkbox" 
                                       value="Administrator" 
                                       id="edit-role-administrator">
                                <label class="form-check-label ml-3 text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center" for="edit-role-administrator">
                                    <span class="mr-2">👑</span>Administrator
                                </label>
                            </div>
                            <div class="form-check flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors duration-200">
                                <input class="form-check-input w-5 h-5 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 dark:focus:ring-indigo-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" 
                                       type="checkbox" 
                                       value="Labeller" 
                                       id="edit-role-labeller">
                                <label class="form-check-label ml-3 text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center" for="edit-role-labeller">
                                    <span class="mr-2">🏷️</span>Labeller
                                </label>
                            </div>
                            <div class="form-check flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors duration-200">
                                <input class="form-check-input w-5 h-5 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 dark:focus:ring-indigo-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" 
                                       type="checkbox" 
                                       value="Reviewer" 
                                       id="edit-role-reviewer">
                                <label class="form-check-label ml-3 text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center" for="edit-role-reviewer">
                                    <span class="mr-2">✅</span>Reviewer
                                </label>
                            </div>
                        </div>
                    </div>
                    <div id="edit-roles-error" class="alert alert-danger bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 text-red-800 dark:text-red-200 p-4 rounded-xl" style="display: none;">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        <span class="font-medium"></span>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-gray-50 dark:bg-gray-800 border-0 rounded-b-xl p-6 flex space-x-3">
                <button type="button" class="btn btn-secondary modal-close px-6 py-2 bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 border-0 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-500 transition-all duration-200" data-bs-dismiss="modal">
                    <i class="fas fa-times mr-2"></i>Cancel
                </button>
                <button type="button" class="btn btn-primary px-6 py-2 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white border-0 rounded-lg font-medium transition-all duration-200 shadow-lg hover:shadow-xl transform hover:scale-105" onclick="updateUserRoles()">
                    <i class="fas fa-save mr-2"></i>Save Changes
                </button>
            </div>
        </div>
    </div>
</div>
