<section id="team" class="py-20 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <div class="container mx-auto px-4">
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-6">Our Team</h2>
            <p class="text-xl text-gray-600 dark:text-gray-300 max-w-3xl mx-auto leading-relaxed">
                Meet the talented professionals who make Facade Studio possible
            </p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 justify-center">
            {% for member in data.Team %}
            <div class="group">
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 text-center border border-gray-200 dark:border-gray-700 hover:border-blue-500 dark:hover:border-blue-400 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-xl">
                    <div class="relative mb-6">
                        <img 
                            src="{{ url_for('static', path=member.img) }}" 
                            class="w-32 h-32 rounded-full mx-auto object-cover border-4 border-gray-200 dark:border-gray-600 group-hover:border-blue-500 dark:group-hover:border-blue-400 transition-all duration-300" 
                            alt="{{ member.name }}"
                        >
                        <div class="absolute inset-0 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
                    </div>
                    <h5 class="text-xl font-bold text-gray-900 dark:text-white mb-2 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                        {{ member.name }}
                    </h5>
                    <p class="text-gray-600 dark:text-gray-300 leading-relaxed">
                        {{ member.job }}
                    </p>
                    
                    <!-- Social Links (if needed in future) -->
                    <div class="mt-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <div class="flex justify-center space-x-3">
                            <!-- Social icons can be added here -->
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
