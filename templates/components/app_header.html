
<header class="navbar-enhanced bg-white dark:bg-slate-900 shadow-xl border-b border-gray-200 dark:border-slate-700 z-50 transition-all duration-300">
    <div class="container mx-auto px-6">
        <div class="flex items-center justify-between h-16">
            <!-- Logo and Title -->
            <div class="flex items-center space-x-4">
                <div class="logo-container">
                    <!-- Light mode logo (Dark-Facade-Logo for light backgrounds) -->
                    <img src="/static/images/Dark-Facade-Logo.png" 
                         alt="Facade AI Studio Logo" 
                         class="logo-light transition-transform duration-300 hover:scale-105 dark:hidden">
                    <!-- Dark mode logo (Light-Facade-Logo for dark backgrounds) -->
                    <img src="/static/images/Light-Facade-Logo.png" 
                         alt="Facade AI Studio Logo" 
                         class="logo-dark transition-transform duration-300 hover:scale-105 hidden dark:block">
                </div>

            </div>

            <!-- Navigation -->
            <nav class="hidden md:flex items-center space-x-2">
                <a href="{{ url_for('home_page') }}" 
                   class="nav-link flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 
                          {% if request.url.path == '/home' or request.url.path == '/' %}
                          nav-link-active bg-blue-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-home mr-2"></i>Home
                </a>
                <a href="{{ url_for('label_page') }}" 
                   class="nav-link flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/label' %}
                          nav-link-active bg-green-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-tags mr-2"></i>Label
                </a>
                <a href="{{ url_for('dashboard_page') }}" 
                   class="nav-link flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/dashboard' %}
                          nav-link-active bg-purple-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-chart-bar mr-2"></i>Dashboard
                </a>
                {% if 'Administrator' in username.roles %}
                <a href="{{ url_for('admin_page') }}" 
                   class="nav-link flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/admin' %}
                          nav-link-active bg-indigo-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-cogs mr-2"></i>Admin
                </a>
                {% endif %}
            </nav>

            <!-- Right side controls -->
            <div class="flex items-center space-x-4">
                <!-- Theme Toggle -->
                <button id="theme-toggle" 
                        class="p-2 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 
                               text-gray-600 dark:text-slate-300 hover:text-gray-900 dark:hover:text-white
                               transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 
                               focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900"
                        aria-label="Toggle theme">
                    <i class="fas fa-moon text-yellow-400"></i>
                </button>

                <!-- User Section -->
                <div class="flex items-center space-x-3">
                    <!-- Login Button -->
                    <button id="login-btn" 
                            class="hidden px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium
                                   transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 
                                   focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900 transform hover:scale-105"
                            onclick="window.location.href='/api/auth/login'"
                            data-loading="Logging in...">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login
                    </button>

                    <!-- User Info -->
                    <div id="user-details-container" class="flex items-center space-x-3" style="display: none;">
                        <div class="user-info-container flex items-center space-x-3 bg-gray-50 dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg px-4 py-2 transition-all duration-200">
                            <div class="user-avatar w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold text-sm">
                                U
                            </div>
                            <div class="hidden md:block">
                                <div class="user-name text-sm font-medium text-gray-900 dark:text-white">User1</div>
                                <div class="user-role text-xs text-gray-500 dark:text-slate-400">Default Admin</div>
                            </div>
                        </div>
                        
                        <button id="logout-btn" 
                                class="logout-btn hidden px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium
                                       transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 
                                       focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900 text-sm transform hover:scale-105"
                                onclick="logout()"
                                data-loading="Logging out...">
                            <i class="fas fa-sign-out-alt mr-1"></i>Logout
                        </button>
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-toggle" 
                        class="md:hidden p-2 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 
                               text-gray-600 dark:text-slate-300 hover:text-gray-900 dark:hover:text-white transition-all duration-200"
                        onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div id="mobile-menu" class="mobile-menu md:hidden hidden border-t border-gray-200 dark:border-slate-700 py-4">
            <div class="space-y-2">
                <a href="{{ url_for('home_page') }}" 
                   class="nav-link flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/home' or request.url.path == '/' %}
                          nav-link-active bg-blue-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-home mr-3"></i>Home
                </a>
                <a href="{{ url_for('label_page') }}" 
                   class="nav-link flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/label' %}
                          nav-link-active bg-green-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-tags mr-3"></i>Label
                </a>
                <a href="{{ url_for('dashboard_page') }}" 
                   class="nav-link flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/dashboard' %}
                          nav-link-active bg-purple-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-chart-bar mr-3"></i>Dashboard
                </a>
                {% if 'Administrator' in username.roles %}
                <a href="{{ url_for('admin_page') }}" 
                   class="nav-link flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
                          {% if request.url.path == '/admin' %}
                          nav-link-active bg-indigo-600 text-white shadow-lg
                          {% else %}
                          text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white
                          {% endif %}">
                    <i class="fas fa-cogs mr-3"></i>Admin
                </a>
                {% endif %}
                
                <!-- Mobile User Info -->
                <div id="mobile-user-info" class="mobile-user-section pt-4 border-t border-gray-200 dark:border-slate-700 mt-4" style="display: none;">
                    <div class="flex items-center px-4 py-3 bg-gray-50 dark:bg-slate-800 rounded-lg">
                        <div class="user-avatar-mobile w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold">
                            U
                        </div>
                        <div class="ml-3">
                            <div class="user-name-mobile text-sm font-medium text-gray-900 dark:text-white">User1</div>
                            <div class="user-role-mobile text-xs text-gray-500 dark:text-slate-400">Default Admin</div>
                        </div>
                    </div>
                    <button id="mobile-logout-btn" 
                            class="logout-btn hidden w-full mt-3 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium
                                   transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 
                                   focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900"
                            onclick="logout()">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const toggleBtn = document.getElementById('mobile-menu-toggle');
            const icon = toggleBtn.querySelector('i');
            
            menu.classList.toggle('hidden');
            
            if (menu.classList.contains('hidden')) {
                icon.className = 'fas fa-bars';
            } else {
                icon.className = 'fas fa-times';
            }
        }
    </script>
</header>
