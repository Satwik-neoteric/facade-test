<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Sidebar collapse styling */
        #left-sidebar.collapsed {
            width: 60px !important;
            min-width: 60px !important;
        }
        
        #left-sidebar.collapsed .sidebar-header-normal,
        #left-sidebar.collapsed .flex-1 {
            display: none !important;
        }
        
        #left-sidebar.collapsed .sidebar-header-collapsed {
            display: flex !important;
        }
        
        #right-sidebar.collapsed {
            width: 60px !important;
            min-width: 60px !important;
        }
        
        #right-sidebar.collapsed .sidebar-header-normal,
        #right-sidebar.collapsed .p-4:not(.sidebar-header-collapsed) {
            display: none !important;
        }
        
        #right-sidebar.collapsed .sidebar-header-collapsed {
            display: flex !important;
        }
        
        /* Bottom panel collapse styling */
        #bottom-panel.collapsed #class-selection-content {
            display: none !important;
        }
        
        #bottom-panel.collapsed #collapse-bottom-panel i {
            transform: rotate(180deg);
        }
        
        /* Collapsed sidebar header */
        .sidebar-header-collapsed {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 60px;
            padding: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="h-screen flex flex-col">
        <!-- Top Bar -->
        <div class="bg-blue-600 text-white p-4">
            <h1>Sidebar Collapse Test</h1>
        </div>
        
        <!-- Main Content -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Left Sidebar -->
            <div id="left-sidebar" class="w-80 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 overflow-hidden">
                <!-- Collapsed Header (shown only when collapsed) -->
                <div class="sidebar-header-collapsed p-4 border-b border-gray-200 flex-shrink-0">
                    <button id="expand-left-sidebar" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <!-- Normal Sidebar Header -->
                <div class="sidebar-header-normal p-6 border-b border-gray-200 flex-shrink-0">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-semibold text-gray-900">Left Sidebar</h2>
                        <button id="collapse-left-sidebar" class="text-gray-500 hover:text-gray-700 transition-colors" aria-expanded="true" aria-controls="left-sidebar">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                    </div>
                    <p>This is the left sidebar content that should hide when collapsed.</p>
                </div>

                <!-- Sidebar Content -->
                <div class="flex-1 overflow-hidden p-4">
                    <p>More sidebar content here...</p>
                </div>
            </div>

            <!-- Center Content -->
            <div class="flex-1 bg-gray-50 flex items-center justify-center">
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-gray-900">Main Content Area</h2>
                    <p class="text-gray-600">The sidebars should collapse to narrow strips</p>
                </div>
            </div>

            <!-- Right Sidebar -->
            <div id="right-sidebar" class="w-80 bg-white border-l border-gray-200 flex flex-col transition-all duration-300 overflow-hidden">
                <!-- Collapsed Header (shown only when collapsed) -->
                <div class="sidebar-header-collapsed p-4 border-b border-gray-200 flex-shrink-0">
                    <button id="expand-right-sidebar" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                
                <!-- Normal Sidebar Header -->
                <div class="sidebar-header-normal p-4 border-b border-gray-200 flex-shrink-0">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-gray-900">Right Sidebar</h3>
                        <button id="collapse-right-sidebar" class="text-gray-500 hover:text-gray-700 transition-colors">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Sidebar Content -->
                <div class="p-4">
                    <p>Right sidebar content goes here...</p>
                </div>
            </div>
        </div>

        <!-- Bottom Panel -->
        <div id="bottom-panel" class="bg-white border-t border-gray-200 p-4 flex-shrink-0 transition-all duration-300">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                    <i class="fas fa-palette text-indigo-600"></i>
                    Bottom Panel
                </h3>
                <button id="collapse-bottom-panel" class="text-gray-500 hover:text-gray-700 transition-colors">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            <div id="class-selection-content">
                <div class="grid grid-cols-4 gap-2">
                    <button class="p-2 bg-blue-100 text-blue-700 rounded">Class 1</button>
                    <button class="p-2 bg-green-100 text-green-700 rounded">Class 2</button>
                    <button class="p-2 bg-red-100 text-red-700 rounded">Class 3</button>
                    <button class="p-2 bg-yellow-100 text-yellow-700 rounded">Class 4</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get DOM elements
        const leftSidebar = document.getElementById('left-sidebar');
        const rightSidebar = document.getElementById('right-sidebar');
        const bottomPanel = document.getElementById('bottom-panel');
        
        const collapseLeftBtn = document.getElementById('collapse-left-sidebar');
        const collapseRightBtn = document.getElementById('collapse-right-sidebar');
        const collapseBottomBtn = document.getElementById('collapse-bottom-panel');
        
        const expandLeftBtn = document.getElementById('expand-left-sidebar');
        const expandRightBtn = document.getElementById('expand-right-sidebar');

        // Left sidebar collapse
        if (collapseLeftBtn && leftSidebar) {
            collapseLeftBtn.addEventListener('click', function() {
                leftSidebar.classList.add('collapsed');
            });
        }
        
        // Left sidebar expand
        if (expandLeftBtn && leftSidebar) {
            expandLeftBtn.addEventListener('click', function() {
                leftSidebar.classList.remove('collapsed');
            });
        }
        
        // Right sidebar collapse
        if (collapseRightBtn && rightSidebar) {
            collapseRightBtn.addEventListener('click', function() {
                rightSidebar.classList.add('collapsed');
            });
        }
        
        // Right sidebar expand
        if (expandRightBtn && rightSidebar) {
            expandRightBtn.addEventListener('click', function() {
                rightSidebar.classList.remove('collapsed');
            });
        }
        
        // Bottom panel collapse/expand
        if (collapseBottomBtn && bottomPanel) {
            collapseBottomBtn.addEventListener('click', function() {
                bottomPanel.classList.toggle('collapsed');
                const icon = collapseBottomBtn.querySelector('i');
                
                if (bottomPanel.classList.contains('collapsed')) {
                    icon.className = 'fas fa-chevron-up';
                } else {
                    icon.className = 'fas fa-chevron-down';
                }
            });
        }
    </script>
</body>
</html>
