<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct HTML Test</title>
    <link rel="stylesheet" href="/static/css/simple.css">
    <style>
        body {
            padding: 20px;
        }
        
        .test-box {
            border: 2px solid blue;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: purple;
        }
    </style>
</head>
<body>
    <h1>Direct HTML Test</h1>
    
    <div class="test-box">
        <h2>This is a test page</h2>
        <p>This HTML file is served directly without using the Jinja2 templating system.</p>
        <p>If you can see this page styled correctly, then the issue is likely with the templating system.</p>
    </div>
    
    <div class="section">
        <div class="section-header">Test Section</div>
        <div class="section-body">
            <p>This section is styled using simple.css</p>
            <button>Test Button</button>
        </div>
    </div>
</body>
</html>
